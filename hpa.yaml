apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: anything-v2
  namespace: anything-v2
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: anything-v2
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
