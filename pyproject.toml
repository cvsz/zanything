[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zanything"
version = "1.0.0"
description = "Enterprise Universal AI Operator"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "uvicorn[standard]>=0.35,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.8,<3",
    "pyjwt[crypto]>=2.9,<3",
    "cryptography>=43,<45",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "redis>=5.0,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"zanything" = ["gui/*", "gui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "UP", "RUF"]
ignore = ["S104", "B008", "S105"]  # B008: FastAPI Depends(), S105: dev defaults

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # assert and mock keys in tests

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
