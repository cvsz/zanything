name: anything-enterprise-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r enterprise/api/requirements.txt pytest httpx
      - run: pytest enterprise/tests -q
      - run: python -m compileall enterprise/api enterprise/integrations

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: enterprise/deploy/docker/Dockerfile
          push: false
          tags: anything-v2:ci
