name: Gold Master Evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gold-master-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-evidence:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: pip install -e ".[dev]"

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade build
          python -m build
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"

      - name: Verify wheel installs cleanly
        run: |
          python -m venv /tmp/zanything-gm-venv
          /tmp/zanything-gm-venv/bin/pip install dist/*.whl
          /tmp/zanything-gm-venv/bin/python -c "from zanything.app import app; print(app.title)"

      - name: Run security regression tests
        run: pytest tests/test_gold_master_auth.py tests/test_auth.py -v --tb=short

      - name: Generate CycloneDX SBOM
        run: |
          python -m pip install "cyclonedx-bom==7.1.0"
          cyclonedx-py environment --output-format JSON --output-file dist/zanything.cdx.json
          test -s dist/zanything.cdx.json

      - name: Generate artifact checksums
        run: sha256sum dist/* | tee dist/SHA256SUMS

      - name: Attest build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/zanything.cdx.json
            dist/SHA256SUMS

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: gold-master-repository-evidence
          path: |
            dist/*
          if-no-files-found: error
